<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="50%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="herbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background circle badge -->
  <circle cx="50" cy="50" r="48" fill="#FFFBEB" stroke="#FDE68A" stroke-width="2.5"/>

  <!-- Steam curls -->
  <path d="M40 32 C38 24, 46 20, 42 12" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M50 30 C47 22, 55 18, 51 10" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M60 32 C58 24, 66 20, 62 12" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Traditional Handi / Cooking Pot Base -->
  <path d="M22 48 C22 44, 25 42, 28 42 L72 42 C75 42, 78 44, 78 48 C78 52, 74 54, 73 56 C77 68, 72 82, 50 82 C28 82, 23 68, 27 56 C26 54, 22 52, 22 48 Z" fill="url(#potGrad)"/>

  <!-- Pot Rim -->
  <ellipse cx="50" cy="42" rx="26" ry="5" fill="url(#goldGrad)"/>
  <ellipse cx="50" cy="42" rx="22" ry="3.5" fill="#7C2D12"/>

  <!-- Pot Brass Band Ornament -->
  <path d="M26 62 Q50 67 74 62" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="64.5" r="3" fill="#FBBF24"/>
  <circle cx="38" cy="63.5" r="2" fill="#FBBF24"/>
  <circle cx="62" cy="63.5" r="2" fill="#FBBF24"/>

  <!-- Traditional Handles (Brass rings) -->
  <path d="M24 49 C18 49, 17 56, 24 58" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M76 49 C82 49, 83 56, 76 58" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Fresh Herb Sprig / Curry Leaves tucked at rim -->
  <path d="M50 42 Q60 34 68 35" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <path d="M58 37 Q63 32 64 36 Q61 40 58 37 Z" fill="url(#herbGrad)"/>
  <path d="M65 35 Q71 31 71 35 Q68 39 65 35 Z" fill="url(#herbGrad)"/>

  <!-- Warm Diya flame icon in center -->
  <path d="M50 50 C46 54, 46 57, 50 60 C54 57, 54 54, 50 50 Z" fill="#F59E0B"/>
</svg>
